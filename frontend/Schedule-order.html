<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule Order</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

    <h1>📅 Schedule Order</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="food-menu.html">Food Menu</a>
        <a href="cart.html">Cart</a>
        <a href="nutrition.html">Nutrition</a>
    </nav>

</header>


<div class="form-box">

    <h2>Schedule Your Order</h2>

    <form
        id="scheduleForm"
        onsubmit="scheduleOrder(event)"
    >

        <!-- Order ID -->
        <label for="scheduleOrderId">
            Order ID
        </label>

        <input
            type="text"
            id="scheduleOrderId"
            placeholder="Enter Order ID"
            required
        >


        <!-- Date -->
        <label for="scheduleDate">
            Delivery Date
        </label>

        <input
            type="date"
            id="scheduleDate"
            required
        >


        <!-- Time -->
        <label for="scheduleTime">
            Delivery Time
        </label>

        <input
            type="time"
            id="scheduleTime"
            required
        >


        <!-- Button -->
        <button type="submit">
            📅 Schedule Order
        </button>

    </form>


    <!-- Scheduled order will appear here -->

    <div id="scheduledOrderDetails"></div>


    <br>

    <button
        type="button"
        onclick="cancelScheduledOrder()"
    >
        ❌ Cancel Scheduled Order
    </button>

</div>


<!-- JavaScript -->

<script src="../js/script.js"></script>

</body>

</html>
