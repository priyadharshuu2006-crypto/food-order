<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>⚙️ Admin Panel</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="admin.html">Admin</a>
    </nav>
</header>

<div class="section">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="admin-card">
            <h2>120</h2>
            <p>Total Users</p>
        </div>

        <div class="admin-card">
            <h2>25</h2>
            <p>Restaurants</p>
        </div>

        <div class="admin-card">
            <h2>450</h2>
            <p>Total Orders</p>
        </div>

        <div class="admin-card">
            <h2>₹85,000</h2>
            <p>Total Revenue</p>
        </div>

    </div>

    <h2>Manage Restaurants</h2>

    <button onclick="addRestaurant()">
        Add Restaurant
    </button>

    <button onclick="alert('Restaurant editing feature selected')">
        Edit Restaurant
    </button>

    <button onclick="alert('Restaurant deleted')">
        Delete Restaurant
    </button>

    <h2>Manage Orders</h2>

    <table>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>1001</td>
            <td>Priya</td>
            <td>₹369</td>
            <td>Delivered</td>
        </tr>

        <tr>
            <td>1002</td>
            <td>Riya</td>
            <td>₹220</td>
            <td>Preparing</td>
        </tr>
    </table>

</div>

<script src="../js/script.js"></script>
</body>
</html>
