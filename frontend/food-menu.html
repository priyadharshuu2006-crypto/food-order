<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>Food Menu</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<div class="section">

    <h2>Popular Food</h2>

    <div class="food-container">

        <div class="food-card">
            <img src="../images/pizza.jpg" alt="Pizza">
            <h2>Cheese Pizza</h2>
            <p>Delicious cheese pizza</p>
            <h3>₹199</h3>
            <button onclick="addToCart('Cheese Pizza',199)">
                Add to Cart
            </button>
        </div>

        <div class="food-card">
            <img src="../images/burger.jpg" alt="Burger">
            <h2>Chicken Burger</h2>
            <p>Crispy chicken burger</p>
            <h3>₹149</h3>
            <button onclick="addToCart('Chicken Burger',149)">
                Add to Cart
            </button>
        </div>

        <div class="food-card">
            <img src="../images/biryani.jpg" alt="Biryani">
            <h2>Chicken Biryani</h2>
            <p>Spicy chicken biryani</p>
            <h3>₹220</h3>
            <button onclick="addToCart('Chicken Biryani',220)">
                Add to Cart
            </button>
        </div>

        <div class="food-card">
            <img src="../images/dosa.jpg" alt="Dosa">
            <h2>Masala Dosa</h2>
            <p>Crispy masala dosa</p>
            <h3>₹80</h3>
            <button onclick="addToCart('Masala Dosa',80)">
                Add to Cart
            </button>
        </div>

    </div>
</div>

<script src="../js/script.js"></script>
</body>
</html>
